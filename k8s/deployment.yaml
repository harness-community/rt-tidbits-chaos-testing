apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  namespace: chaos-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-app
  template:
    metadata:
      labels:
        app: ecommerce-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: ecommerce-app
          image: nidayra/ecommerce-cv-app:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-app
  namespace: chaos-demo
spec:
  selector:
    app: ecommerce-app
  ports:
    - port: 8080
      targetPort: 8080
